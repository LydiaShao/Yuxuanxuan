<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" preserveAspectRatio="none">
  <defs>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="14%" stop-color="#000"/>
      <stop offset="58%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#fff"/>
    </linearGradient>
    <filter id="dissolve" x="-4%" y="-8%" width="108%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="1.05 0.22" numOctaves="4" seed="6" result="noise"/>
      <feComponentTransfer in="noise" result="speck">
        <feFuncR type="discrete" tableValues="0 0 1 1"/>
        <feFuncG type="discrete" tableValues="0 0 1 1"/>
        <feFuncB type="discrete" tableValues="0 0 1 1"/>
      </feComponentTransfer>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="42" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="512" height="256" fill="url(#ramp)" filter="url(#dissolve)"/>
</svg>
